# Configuración EXCLUSIVA de pruebas: base de datos H2 en memoria (modo MySQL).
# No toca la base de datos MySQL real ni sus datos.
spring.application.name=ChickenBikerV2-test

spring.datasource.url=jdbc:h2:mem:chicken_biker_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
