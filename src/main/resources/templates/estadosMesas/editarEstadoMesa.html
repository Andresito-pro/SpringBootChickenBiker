<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Editar Estado de Mesa</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Editar Estado de Mesa</h1>
                    <div class="greeting-meta">
                        <span>Modifica la información del estado seleccionado</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="icon-btn" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <!-- ENCABEZADO -->
                <div class="page-header">
                    <div>
                        <h2 class="page-header-title">Editar estado de mesa</h2>
                        <p class="page-header-sub">
                            Actualiza la información de <strong th:text="${estadoMesa.nombreEstadoMesa}">Estado</strong>.
                        </p>
                    </div>
                    <div class="page-header-actions">
                        <a th:href="@{/estados-mesas}" class="btn-cb btn-cb-secondary">
                            <i class="bi bi-arrow-left me-2"></i> Volver al listado
                        </a>
                    </div>
                </div>

                <!-- ALERTA DE ERROR -->
                <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${error}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <!-- FORMULARIO -->
                <div class="card-cb">
                    <div class="card-cb-body card-cb-body-lg">
                        <form th:action="@{/estados-mesas}" th:object="${estadoMesa}" method="post" class="form-cb">
                            <input type="hidden" th:field="*{idEstadoMesa}"/>

                            <div class="row g-4">

                                <!-- NOMBRE -->
                                <div class="col-12 col-md-6">
                                    <label for="nombreEstadoMesa" class="form-label">Nombre del estado <span class="form-required">*</span></label>
                                    <input type="text" class="form-control" id="nombreEstadoMesa"
                                           th:field="*{nombreEstadoMesa}" maxlength="45" required>
                                </div>

                                <!-- DESCRIPCIÓN -->
                                <div class="col-12 order-md-last">
                                    <label for="descripcionEstadoMesa" class="form-label">Descripción</label>
                                    <input type="text" class="form-control" id="descripcionEstadoMesa"
                                           th:field="*{descripcionEstadoMesa}" maxlength="45">
                                </div>

                                <!-- ESTADO ACTIVO -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label d-block">Estado</label>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" role="switch"
                                               id="activoEstadoMesa" name="activoEstadoMesa" value="1"
                                               th:checked="${estadoMesa.activoEstadoMesa != null and estadoMesa.activoEstadoMesa == 1}">
                                        <label class="form-check-label" for="activoEstadoMesa">Estado activo</label>
                                    </div>
                                </div>

                            </div>

                            <hr class="form-divider">

                            <!-- BOTONES -->
                            <div class="form-actions">
                                <a th:href="@{/estados-mesas}" class="btn-cb btn-cb-secondary">
                                    <i class="bi bi-x-lg me-2"></i> Cancelar
                                </a>
                                <button type="submit" class="btn-cb btn-cb-primary">
                                    <i class="bi bi-floppy-fill me-2"></i> Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
