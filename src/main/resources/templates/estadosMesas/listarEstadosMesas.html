<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Estados de Mesas</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Estados de Mesas</h1>
                    <div class="greeting-meta">
                        <span>Gestiona los estados disponibles para las mesas del restaurante</span>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/topbar :: acciones}"></div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <!-- ALERTAS -->
                <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${error}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div th:if="${mensaje != null}" class="alert alert-cb alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${mensaje}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <!-- ENCABEZADO -->
                <div class="page-header">
                    <div>
                        <h2 class="page-header-title">Listado de estados de mesa</h2>
                        <p class="page-header-sub">
                            Total registrados: <strong th:text="${totalEstadosMesas}">0</strong>
                        </p>
                    </div>
                    <div class="page-header-actions">
                        <a th:href="@{/estados-mesas/nuevo}" class="btn-cb btn-cb-primary">
                            <i class="bi bi-plus-lg me-2"></i> Agregar estado
                        </a>
                    </div>
                </div>

                <!-- TABLA -->
                <div class="card-cb">
                    <div class="card-cb-body">
                        <div class="table-responsive">
                            <table class="table table-cb table-hover align-middle">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(listaEstadosMesas)}">
                                    <td colspan="4" class="table-empty">
                                        No hay estados de mesa registrados.
                                    </td>
                                </tr>

                                <tr th:each="em : ${listaEstadosMesas}">
                                    <td th:text="${em.idEstadoMesa}">1</td>
                                    <td class="fw-semibold" th:text="${em.nombreEstadoMesa}">Disponible</td>
                                    <td>
                                                <span th:if="${em.activoEstadoMesa != null and em.activoEstadoMesa == 1}"
                                                      class="badge-cb badge-cb-success">
                                                    <i class="bi bi-check-circle-fill me-1"></i> Activo
                                                </span>
                                        <span th:unless="${em.activoEstadoMesa != null and em.activoEstadoMesa == 1}"
                                              class="badge-cb badge-cb-danger">
                                                    <i class="bi bi-x-circle-fill me-1"></i> Inactivo
                                                </span>
                                    </td>
                                    <td class="text-end">
                                        <div class="row-actions">
                                            <a th:href="@{/estados-mesas/editar/{id}(id=${em.idEstadoMesa})}"
                                               class="btn-cb btn-cb-icon btn-cb-edit" title="Editar">
                                                <i class="bi bi-pencil-fill"></i>
                                            </a>

                                            <form method="post" th:action="@{/estados-mesas/eliminar/{id}(id=${em.idEstadoMesa})}">
                                                <button type="submit" class="btn-cb btn-cb-icon btn-cb-danger" title="Eliminar"
                                                        data-confirm="¿Seguro que deseas eliminar este estado de mesa?" data-confirm-titulo="Eliminar estado de mesa" data-confirm-aceptar="Eliminar">
                                                    <i class="bi bi-trash3"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
