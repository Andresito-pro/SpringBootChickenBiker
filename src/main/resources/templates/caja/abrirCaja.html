<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Caja · Chicken Biker</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Abrir Caja</h1>
                    <div class="greeting-meta">
                        <span>Gestión de turnos y efectivo inicial</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="icon-btn" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <main class="content">

            <!-- Alertas -->
            <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                <div class="alert-cb-body" th:text="${error}"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div th:if="${mensaje != null}" class="alert alert-cb alert-info alert-dismissible fade show" role="alert">
                <i class="bi bi-info-circle-fill alert-cb-icon"></i>
                <div class="alert-cb-body" th:text="${mensaje}"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <!-- Formulario Estilizado de Apertura de Caja -->
            <div class="cash-open-container">
                <div class="card-cb fade-up">

                    <!-- Encabezado con Icono Centralizado -->
                    <div class="card-cb-header card-cb-header-center">
                        <div class="icon-bubble">
                            <i class="bi bi-cash-stack"></i>
                        </div>
                        <h3>Apertura de Turno</h3>
                        <p>Ingresa el saldo en efectivo disponible en caja para comenzar las operaciones</p>
                    </div>

                    <!-- Cuerpo de la Tarjeta -->
                    <div class="card-cb-body">
                        <form method="post" th:action="@{/caja/abrir}" class="form-cb">

                            <div class="mb-4">
                                <label for="montoInicial" class="form-label">Monto Inicial en Caja ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-coin"></i></span>
                                    <input type="number" step="0.01" min="0" id="montoInicial" name="montoInicial"
                                           class="form-control" placeholder="0.00" required autocomplete="off">
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn-cb btn-cb-primary">
                                    <i class="bi bi-unlock me-2"></i> Confirmar y Abrir Caja
                                </button>
                                <a th:href="@{/caja}" class="btn-cb btn-cb-secondary">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>

                </div>
            </div>

        </main>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
