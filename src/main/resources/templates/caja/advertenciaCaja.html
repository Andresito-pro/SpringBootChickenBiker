<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Caja · Chicken Biker</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Control de Caja</h1>
                    <div class="greeting-meta">
                        <span>Validación de cierre de turno</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <main class="content">
            <div class="cash-open-container">
                <div class="card-cb card-cb-center fade-up">
                    <div class="card-cb-body card-cb-body-flush">
                        <div class="icon-bubble">
                            <i class="bi"
                               th:classappend="${advertencia.tipo == 'error' ? ' bi-exclamation-octagon-fill text-danger' : ' bi-exclamation-triangle-fill text-warning'}"></i>
                        </div>
                        <h3 class="mb-2" th:text="${advertencia.titulo}">No es posible cerrar la caja</h3>
                        <p class="fw-semibold text-dark mb-2" th:text="${advertencia.motivo}"></p>
                        <p class="text-muted mb-4" th:text="${advertencia.instruccion}"></p>

                        <div class="d-grid gap-2">
                            <a th:if="${advertencia.urlAccion != null}"
                               th:href="@{${advertencia.urlAccion}}"
                               class="btn-cb btn-cb-primary"
                               th:text="${advertencia.textoAccion}">
                                Continuar
                            </a>

                            <a th:if="${advertencia.urlAccionSecundaria != null}"
                               th:href="@{${advertencia.urlAccionSecundaria}}"
                               class="btn-cb btn-cb-secondary"
                               th:text="${advertencia.textoAccionSecundaria}">
                                Volver
                            </a>
                        </div>

                        <p th:if="${advertencia.nota != null}" class="text-muted small mt-3 mb-0" th:text="${advertencia.nota}"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
