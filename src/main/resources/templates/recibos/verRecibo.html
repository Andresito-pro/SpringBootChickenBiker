<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Recibo ' + ${recibo.numeroRecibo} + ' · Chicken Biker'">Recibo · Chicken Biker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1 th:text="'Recibo ' + ${recibo.numeroRecibo}">Recibo</h1>
                    <div class="greeting-meta">
                        <span>Recibo interno de control · No es factura electrónica</span>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/topbar :: acciones}"></div>
        </header>

        <main class="content">

            <div class="card-cb fade-up mb-4">
                <div class="card-cb-header">
                    <div>
                        <h3>Chicken Biker</h3>
                        <p>Recibo interno N° <strong th:text="${recibo.numeroRecibo}"></strong></p>
                    </div>
                    <span class="badge-cb badge-cb-lg"
                          th:classappend="${recibo.estadoReciboIdEstadoRecibo == 2} ? 'badge-cb-success' : (${recibo.estadoReciboIdEstadoRecibo == 1} ? 'badge-cb-warning' : 'badge-cb-neutral')"
                          th:text="${nombreEstadoRecibo}">Estado</span>
                    <span th:if="${pedidoAnulado}" class="badge-cb badge-cb-lg badge-cb-anulado ms-1"
                          title="El pedido está anulado: este recibo no cuenta como venta ni se puede cobrar">Pedido anulado</span>
                </div>
                <div class="card-cb-body">
                    <div class="detail-item">
                        <span class="detail-label"><i class="bi bi-calendar3 text-muted"></i> Fecha de emisión</span>
                        <span class="detail-value" th:text="${#temporals.format(recibo.fechaEmision, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label"><i class="bi bi-receipt text-muted"></i> Pedido</span>
                        <span class="detail-value">
                            <span th:text="'#' + ${recibo.pedidoVentaIdPedidoVenta}"></span>
                            <span th:if="${pedido != null}" th:text="' · ' + ${pedido.tipoPedido}"></span>
                        </span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label"><i class="bi bi-credit-card text-muted"></i> Método de pago</span>
                        <span class="detail-value"
                              th:text="${recibo.estadoReciboIdEstadoRecibo == 1 ? 'Pendiente de cobro' : nombreMetodoPago}"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label"><i class="bi bi-safe text-muted"></i> Turno de caja</span>
                        <span class="detail-value" th:text="'#' + ${recibo.aperturaCierreCajaIdAperturaCierreCaja}"></span>
                    </div>
                </div>
            </div>

            <div class="card-cb fade-up mb-4">
                <div class="table-responsive">
                    <table class="table table-cb align-middle mb-0">
                        <thead>
                        <tr>
                            <th class="ps-4">Producto</th>
                            <th>Cantidad</th>
                            <th>Precio unitario</th>
                            <th class="text-end pe-4">Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="det : ${detalles}">
                            <td class="ps-4 fw-semibold" th:text="${nombresProductos[det.productosIdProductos]}"></td>
                            <td th:text="${det.cantidad}"></td>
                            <td th:text="'$ ' + ${#numbers.formatDecimal(det.precioUnitario, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-end pe-4" th:text="'$ ' + ${#numbers.formatDecimal(det.subTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <th colspan="3" class="ps-4 text-end">Total</th>
                            <th class="text-end pe-4" th:text="'$ ' + ${#numbers.formatDecimal(recibo.totalGeneral, 1, 'COMMA', 2, 'POINT')}"></th>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/recibos}" class="btn-cb btn-cb-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
                <button type="button" class="btn-cb btn-cb-primary" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
