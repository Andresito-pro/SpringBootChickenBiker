<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibos internos · Chicken Biker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Recibos internos</h1>
                    <div class="greeting-meta">
                        <span>Control y trazabilidad de ventas (no constituyen factura electrónica)</span>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/topbar :: acciones}"></div>
        </header>

        <main class="content">

            <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                <div class="alert-cb-body" th:text="${error}"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div class="card-cb fade-up" data-filter-scope>
                <div class="card-cb-header">
                    <div>
                        <h3>Recibos emitidos</h3>
                        <p th:text="${#lists.size(recibos)} + ' recibo(s)'"></p>
                    </div>
                    <div class="filter-bar">
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" data-filter-search placeholder="Buscar por N° de recibo o pedido..."
                                   autocomplete="off" aria-label="Buscar recibos">
                        </div>
                        <span class="filter-result d-none" data-filter-result aria-live="polite"></span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-cb table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th class="ps-4">Recibo</th>
                            <th>Pedido</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Método de pago</th>
                            <th class="text-end">Total</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${recibos}" data-filter-item
                            th:data-search="${r.numeroRecibo + ' pedido ' + r.pedidoVentaIdPedidoVenta}">
                            <td class="ps-4 fw-semibold" th:text="${r.numeroRecibo}"></td>
                            <td th:text="'#' + ${r.pedidoVentaIdPedidoVenta}"></td>
                            <td th:text="${#temporals.format(r.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:with="anulado=${pedidosAnulados != null and pedidosAnulados.contains(r.pedidoVentaIdPedidoVenta)}">
                                <span class="badge-cb"
                                      th:classappend="${r.estadoReciboIdEstadoRecibo == 2} ? 'badge-cb-success' : (${r.estadoReciboIdEstadoRecibo == 1} ? 'badge-cb-warning' : 'badge-cb-neutral')"
                                      th:text="${mapaEstados[r.estadoReciboIdEstadoRecibo]}">Estado</span>
                                <span th:if="${anulado}" class="badge-cb badge-cb-anulado ms-1"
                                      title="El pedido está anulado: este recibo no cuenta como venta ni se puede cobrar">Pedido anulado</span>
                            </td>
                            <td th:text="${r.estadoReciboIdEstadoRecibo == 1 ? '—' : mapaMetodos[r.metodoPagoIdMetodoPago]}"></td>
                            <td class="text-end fw-semibold"
                                th:text="'$ ' + ${#numbers.formatDecimal(r.totalGeneral, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-end pe-4">
                                <a th:href="@{/recibos/{id}(id=${r.idCabeceraRecibo})}" class="btn-cb btn-cb-secondary btn-cb-sm">
                                    <i class="bi bi-eye"></i> Ver
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recibos)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay recibos registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/filtros.js}"></script>
</body>
</html>
