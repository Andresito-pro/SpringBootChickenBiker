<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Agregar Rol</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1 th:text="${rol.idRoles != null ? 'Editar Rol' : 'Agregar Rol'}">Agregar Rol</h1>
                    <div class="greeting-meta">
                            <span th:text="${rol.idRoles != null ? 'Modifica los datos del rol seleccionado' : 'Registra un nuevo rol de usuario'}">
                                Registra un nuevo rol de usuario
                            </span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="cash-btn" id="cashToggleBtn" type="button" data-open="true">
                    <span class="cash-indicator"></span>
                    <span class="cash-label">Caja Abierta</span>
                </button>
                <button class="icon-btn" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <!-- ENCABEZADO -->
                <div class="page-header">
                    <div>
                        <h2 class="page-header-title" th:text="${rol.idRoles != null ? 'Editar rol' : 'Nuevo rol'}">Nuevo rol</h2>
                        <p class="page-header-sub">Completa la información del rol.</p>
                    </div>
                    <div class="page-header-actions">
                        <a th:href="@{/roles/listarRol}" class="btn-cb btn-cb-secondary">
                            <i class="bi bi-arrow-left me-2"></i> Volver al listado
                        </a>
                    </div>
                </div>

                <!-- FORMULARIO -->
                <div class="card-cb">
                    <div class="card-cb-body card-cb-body-lg">
                        <form th:action="@{/roles}" th:object="${rol}" method="post" class="form-cb">
                            <input type="hidden" th:field="*{idRoles}"/>

                            <div class="row g-4">
                                <!-- NOMBRE -->
                                <div class="col-12">
                                    <label for="nombreRol" class="form-label">Nombre del rol <span class="form-required">*</span></label>
                                    <input type="text" class="form-control" id="nombreRol" th:field="*{nombreRol}"
                                           placeholder="Ej. Administrador" maxlength="100" required>
                                    <div class="form-text">Ingresa el nombre con el que se identificará el rol.</div>
                                </div>
                            </div>

                            <hr class="form-divider">

                            <!-- BOTONES -->
                            <div class="form-actions">
                                <a th:href="@{/roles/listarRol}" class="btn-cb btn-cb-secondary">
                                    <i class="bi bi-x-lg me-2"></i> Cancelar
                                </a>
                                <button type="submit" class="btn-cb btn-cb-primary">
                                    <i class="bi bi-floppy-fill me-2"></i> Guardar rol
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>

</body>
</html>
