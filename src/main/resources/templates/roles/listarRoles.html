<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Roles</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Roles</h1>
                    <div class="greeting-meta">
                        <span>Gestiona los roles de usuario del sistema</span>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/topbar :: acciones}"></div>
        </header>

        <!-- VISTA Y CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${error}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div th:if="${mensaje != null}" class="alert alert-cb alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${mensaje}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div data-filter-scope>

                    <!-- CABECERA SUPERIOR: Buscador y Botón Agregar -->
                    <div class="toolbar fade-up">
                        <div class="toolbar-filters filter-bar">
                            <div class="search-box">
                                <i class="bi bi-search"></i>
                                <input type="text" data-filter-search placeholder="Buscar rol por nombre o ID..."
                                       autocomplete="off" aria-label="Buscar roles">
                            </div>
                            <span class="filter-result d-none" data-filter-result aria-live="polite"></span>
                            <button type="button" class="btn-cb btn-cb-secondary btn-cb-sm" data-filter-clear disabled>
                                <i class="bi bi-x-circle me-1"></i> Limpiar
                            </button>
                        </div>

                        <a th:href="@{/roles/nuevoRol}" class="btn-cb btn-cb-primary">
                            <i class="bi bi-plus-lg me-2"></i> Agregar rol
                        </a>
                    </div>

                    <!-- CUADRÍCULA DE TARJETAS DE ROLES -->
                    <div class="roles-grid fade-up">

                        <div th:if="${#lists.isEmpty(roles)}" class="empty-state">
                            <i class="bi bi-shield-lock fs-1 text-muted mb-3"></i>
                            <h5 class="fw-bold text-dark">No hay roles registrados</h5>
                            <p class="text-muted mb-0">Comienza registrando los roles de acceso para los usuarios del sistema.</p>
                        </div>

                        <th:block th:unless="${#lists.isEmpty(roles)}">
                            <div th:each="r : ${roles}" class="role-card" data-filter-item
                                 th:attr="data-search=${r.nombreRol + ' #' + r.idRoles}">
                                <div>
                                    <div class="role-card-top">
                                        <div class="role-icon-wrapper">
                                            <i class="bi bi-person-gear"></i>
                                        </div>
                                        <div>
                                            <span class="role-id-badge" th:text="'ID #' + ${r.idRoles}">ID #1</span>
                                            <h3 class="role-title" th:text="${r.nombreRol}">Administrador</h3>
                                        </div>
                                    </div>
                                </div>

                                <!-- Pie de Tarjeta (Botones de Acción) -->
                                <div class="role-card-footer">
                                    <a th:href="@{/roles/editar/{id}(id=${r.idRoles})}"
                                       class="btn-cb btn-cb-icon btn-cb-edit" title="Editar Rol">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>

                                    <form method="post" th:action="@{/roles/eliminar/{id}(id=${r.idRoles})}">
                                        <button type="submit" class="btn-cb btn-cb-icon btn-cb-danger" title="Eliminar Rol"
                                                data-confirm="¿Seguro que deseas eliminar este rol?" data-confirm-titulo="Eliminar rol" data-confirm-aceptar="Eliminar">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div class="empty-state d-none" data-filter-empty>
                                <i class="bi bi-search"></i>
                                <h5 class="fw-bold">No se encontraron roles</h5>
                                <p class="text-muted mb-3">Ningún rol coincide con la búsqueda.</p>
                                <button type="button" class="btn-cb btn-cb-secondary btn-cb-sm" data-filter-clear>
                                    <i class="bi bi-x-circle me-1"></i> Limpiar búsqueda
                                </button>
                            </div>
                        </th:block>

                    </div>

                </div><!-- /data-filter-scope -->

            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/filtros.js}"></script>
</body>
</html>
