<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tipoDocumento.idTipoDocumento > 0 ? 'Chicken Biker · Editar tipo de documento' : 'Chicken Biker · Nuevo tipo de documento'}">
        Chicken Biker · Tipo de documento
    </title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Tipos de documento</h1>
                    <div class="greeting-meta">
                            <span th:text="${tipoDocumento.idTipoDocumento > 0 ? 'Modifica un tipo de documento' : 'Registra un nuevo tipo de documento'}">
                                Registra un nuevo tipo de documento
                            </span>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/topbar :: acciones}"></div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <!-- ALERTA DE ERROR -->
                <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${error}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <!-- ENCABEZADO -->
                <div class="page-header">
                    <div>
                        <h2 class="page-header-title"
                            th:text="${tipoDocumento.idTipoDocumento > 0 ? 'Editar tipo de documento' : 'Nuevo tipo de documento'}">
                            Nuevo tipo de documento
                        </h2>
                        <p class="page-header-sub"
                           th:text="${tipoDocumento.idTipoDocumento > 0 ? 'Modifica la información del tipo de documento.' : 'Completa la información del tipo de documento.'}">
                            Completa la información del tipo de documento.
                        </p>
                    </div>
                    <div class="page-header-actions">
                        <a th:href="@{/tipos-documento}" class="btn-cb btn-cb-secondary">
                            <i class="bi bi-arrow-left me-2"></i> Volver al listado
                        </a>
                    </div>
                </div>

                <!-- FORMULARIO -->
                <div class="card-cb card-cb-compact">
                    <div class="card-cb-body card-cb-body-lg">
                        <form th:action="@{/tipos-documento}" th:object="${tipoDocumento}" method="post" class="form-cb">
                            <input type="hidden" th:field="*{idTipoDocumento}"/>

                            <div class="row g-4">
                                <!-- NOMBRE -->
                                <div class="col-12">
                                    <label for="nombreTipoDocumento" class="form-label">Nombre del tipo de documento <span class="form-required">*</span></label>
                                    <input type="text" class="form-control" id="nombreTipoDocumento" th:field="*{nombreTipoDocumento}"
                                           placeholder="Ej. Permiso por Protección Temporal" maxlength="45" required>
                                    <div class="form-text">Máximo 45 caracteres. No puede repetirse.</div>
                                </div>
                                <div class="col-12">
                                    <label for="descripcionTipoDocumento" class="form-label">Descripción</label>
                                    <input type="text" class="form-control" id="descripcionTipoDocumento"
                                           th:field="*{descripcionTipoDocumento}" maxlength="45">
                                </div>
                            </div>

                            <hr class="form-divider">

                            <!-- BOTONES -->
                            <div class="form-actions">
                                <a th:href="@{/tipos-documento}" class="btn-cb btn-cb-secondary">
                                    <i class="bi bi-x-lg me-2"></i> Cancelar
                                </a>
                                <button type="submit" class="btn-cb btn-cb-primary">
                                    <i class="bi bi-floppy-fill me-2"></i>
                                    <span th:text="${tipoDocumento.idTipoDocumento > 0 ? 'Guardar cambios' : 'Guardar'}">Guardar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
