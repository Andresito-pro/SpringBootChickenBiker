<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Editar Mesa</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Editar Mesa</h1>
                    <div class="greeting-meta">
                        <span>Modifica la información de la mesa seleccionada</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="icon-btn" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <!-- ENCABEZADO -->
                <div class="page-header">
                    <div>
                        <h2 class="page-header-title">Editar mesa</h2>
                        <p class="page-header-sub">
                            Actualiza la información de <strong th:text="'Mesa ' + ${mesa.numeroMesa}">Mesa 1</strong>.
                        </p>
                    </div>
                    <div class="page-header-actions">
                        <a th:href="@{/mesas}" class="btn-cb btn-cb-secondary">
                            <i class="bi bi-arrow-left me-2"></i> Volver al listado
                        </a>
                    </div>
                </div>

                <!-- ALERTA DE ERROR -->
                <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${error}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <!-- FORMULARIO -->
                <div class="card-cb">
                    <div class="card-cb-body card-cb-body-lg">
                        <form th:action="@{/mesas}" th:object="${mesa}" method="post" class="form-cb">
                            <input type="hidden" th:field="*{idMesa}"/>

                            <div class="row g-4">

                                <!-- NÚMERO DE MESA -->
                                <div class="col-12 col-md-6">
                                    <label for="numeroMesa" class="form-label">Número de mesa <span class="form-required">*</span></label>
                                    <input type="number" class="form-control" id="numeroMesa"
                                           th:field="*{numeroMesa}" min="1" required>
                                </div>

                                <!-- ESTADO -->
                                <div class="col-12 col-md-6">
                                    <label for="estadoMesaIdEstadoMesa" class="form-label">Estado <span class="form-required">*</span></label>
                                    <select class="form-select" id="estadoMesaIdEstadoMesa"
                                            name="estadoMesaIdEstadoMesa" required>
                                        <option value="" disabled>Selecciona un estado</option>
                                        <option th:each="em : ${listaEstadosMesas}"
                                                th:value="${em.idEstadoMesa}" th:selected="${mesa.estadoMesaIdEstadoMesa == em.idEstadoMesa}"
                                                th:text="${em.nombreEstadoMesa}">Estado</option>
                                    </select>
                                </div>

                            </div>

                            <hr class="form-divider">

                            <!-- BOTONES -->
                            <div class="form-actions">
                                <a th:href="@{/mesas}" class="btn-cb btn-cb-secondary">
                                    <i class="bi bi-x-lg me-2"></i> Cancelar
                                </a>
                                <button type="submit" class="btn-cb btn-cb-primary">
                                    <i class="bi bi-floppy-fill me-2"></i> Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
