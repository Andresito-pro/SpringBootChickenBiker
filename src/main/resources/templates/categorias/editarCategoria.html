<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Editar Categoría</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Editar Categoría</h1>
                    <div class="greeting-meta">
                        <span>Modifica el nombre de la categoría seleccionada</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="cash-btn" id="cashToggleBtn" type="button" data-open="true">
                    <span class="cash-indicator"></span>
                    <span class="cash-label">Caja Abierta</span>
                </button>
                <button class="icon-btn" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <div class="page-header">
                    <div>
                        <h2 class="page-header-title">Editar categoría</h2>
                        <p class="page-header-sub">Actualiza la información de la categoría.</p>
                    </div>
                    <div class="page-header-actions">
                        <a th:href="@{/categorias}" class="btn-cb btn-cb-secondary">
                            <i class="bi bi-arrow-left me-2"></i> Volver al listado
                        </a>
                    </div>
                </div>

                <div class="card-cb">
                    <div class="card-cb-body card-cb-body-lg">
                        <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="form-cb">
                            <input type="hidden" th:field="*{idCategoriaProducto}"/>

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="nombreCategoria" class="form-label">Nombre de la categoría <span class="form-required">*</span></label>
                                    <input type="text" class="form-control" id="nombreCategoria" th:field="*{nombreCategoria}"
                                           maxlength="45" required>
                                </div>
                            </div>

                            <hr class="form-divider">

                            <div class="form-actions">
                                <a th:href="@{/categorias}" class="btn-cb btn-cb-secondary">
                                    <i class="bi bi-x-lg me-2"></i> Cancelar
                                </a>
                                <button type="submit" class="btn-cb btn-cb-primary">
                                    <i class="bi bi-floppy-fill me-2"></i> Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
