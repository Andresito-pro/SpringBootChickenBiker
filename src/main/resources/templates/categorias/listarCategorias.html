<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Biker · Categorías</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Chicken Biker -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <div class="greeting-block">
                    <h1>Gestión de Categorías</h1>
                    <div class="greeting-meta">
                        <span>Agrupa los productos del menú por categoría</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button class="cash-btn" id="cashToggleBtn" type="button" data-open="true">
                    <span class="cash-indicator"></span>
                    <span class="cash-label">Caja Abierta</span>
                </button>
                <button class="icon-btn" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-avatar"
                     th:text="${session.usuarioSesion != null ? #strings.toUpperCase(#strings.substring(session.usuarioSesion.nombreUsuario, 0, 2)) : 'CB'}">
                    CB
                </div>
            </div>
        </header>

        <!-- CONTENIDO -->
        <main class="content">
            <div class="container-fluid">

                <!-- Alerta de error -->
                <div th:if="${error != null}" class="alert alert-cb alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-octagon-fill alert-cb-icon"></i>
                    <div class="alert-cb-body" th:text="${error}"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div data-filter-scope>

                    <!-- CABECERA: Buscador y Botón Nueva Categoría -->
                    <div class="toolbar fade-up">
                        <div class="toolbar-filters filter-bar">
                            <div class="search-box">
                                <i class="bi bi-search"></i>
                                <input type="text" data-filter-search placeholder="Buscar categoría por nombre o ID..."
                                       autocomplete="off" aria-label="Buscar categorías">
                            </div>
                            <span class="filter-result d-none" data-filter-result aria-live="polite"></span>
                            <button type="button" class="btn-cb btn-cb-secondary btn-cb-sm" data-filter-clear disabled>
                                <i class="bi bi-x-circle me-1"></i> Limpiar
                            </button>
                        </div>

                        <button type="button" class="btn-cb btn-cb-primary" data-bs-toggle="modal" data-bs-target="#modalCategoria">
                            <i class="bi bi-plus-lg me-2"></i> Nueva Categoría
                        </button>
                    </div>

                    <!-- CUADRÍCULA DE TARJETAS -->
                    <div class="row g-4 fade-up">

                        <!-- Estado Vacío -->
                        <div th:if="${#lists.isEmpty(categorias)}" class="col-12">
                            <div class="empty-state">
                                <i class="bi bi-layers"></i>
                                <h5>No hay categorías registradas aún</h5>
                                <p class="mb-0">Usa "Nueva Categoría" para crear la primera.</p>
                            </div>
                        </div>

                        <!-- Listado de Categorías -->
                        <th:block th:unless="${#lists.isEmpty(categorias)}">
                            <div th:each="categoria : ${categorias}" class="col-md-4" data-filter-item
                                 th:attr="data-search=${categoria.nombreCategoria + ' #' + categoria.idCategoriaProducto}">
                                <div class="card-cb h-100">
                                    <div class="card-cb-body">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h5 class="card-cb-title">
                                                <i class="bi bi-box-seam text-primary me-2"></i>
                                                <span th:text="${categoria.nombreCategoria}">Hamburguesas</span>
                                            </h5>
                                            <span class="badge-cb badge-cb-warning">Categoría</span>
                                        </div>
                                    </div>
                                    <div class="card-cb-footer">
                                        <small class="text-muted" th:text="'ID: ' + ${categoria.idCategoriaProducto}">ID: 1</small>

                                        <div class="row-actions">
                                            <a th:href="@{/categorias/editar/{id}(id=${categoria.idCategoriaProducto})}"
                                               class="btn-cb btn-cb-icon btn-cb-edit" title="Editar">
                                                <i class="bi bi-pencil-fill"></i>
                                            </a>

                                            <form th:action="@{/categorias/eliminar/{id}(id=${categoria.idCategoriaProducto})}" method="post">
                                                <button type="submit" class="btn-cb btn-cb-icon btn-cb-danger" title="Eliminar"
                                                        data-confirm="¿Eliminar categoría?">
                                                    <i class="bi bi-trash3"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Sin coincidencias -->
                            <div class="col-12 d-none" data-filter-empty>
                                <div class="empty-state">
                                    <i class="bi bi-search"></i>
                                    <h5>No se encontraron categorías</h5>
                                    <p class="text-muted mb-3">Ninguna categoría coincide con la búsqueda.</p>
                                    <button type="button" class="btn-cb btn-cb-secondary btn-cb-sm" data-filter-clear>
                                        <i class="bi bi-x-circle me-1"></i> Limpiar búsqueda
                                    </button>
                                </div>
                            </div>
                        </th:block>

                    </div>

                </div><!-- /data-filter-scope -->

            </div>
        </main>
    </div>
</div>

<!-- Modal para Nueva Categoría -->
<div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCategoriaLabel">Nueva Categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form th:action="@{/categorias}" th:object="${categoriaNueva}" method="post" class="form-cb">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nombreCategoria" class="form-label">Nombre de la Categoría <span class="form-required">*</span></label>
                        <input type="text" class="form-control" id="nombreCategoria" th:field="*{nombreCategoria}"
                               placeholder="Ej. Alitas y Pollo" maxlength="45" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cb btn-cb-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn-cb btn-cb-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/filtros.js}"></script>
</body>
</html>
