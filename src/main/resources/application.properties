spring.application.name=ChickenBikerV2


spring.datasource.url=jdbc:mysql://localhost:3307/chicken_biker?useUnicode=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

# El servidor es MariaDB (XAMPP). Sin este dialecto Hibernate asume MySQL 8 y
# genera "FOR UPDATE OF <alias>" en los bloqueos pesimistas, que MariaDB rechaza.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.show-sql=true

